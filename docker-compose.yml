
services:
  mongo:
    image: mongo:6.0
    container_name: kraoq-mongo
    # Internal communication only
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: kraoq-redis
    expose:
      - "6379"
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: kraoq-backend
    command: npm run dev
    # Removed public port mapping for security - cloudflared will route traffic internally
    ports:
      - "3001:3001"
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=example
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

