
services:
  mongo:
    image: mongo:6.0
    container_name: kraoq-mongo
    # Internal communication only
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: kraoq-backend
    command: npm run dev
    # Removed public port mapping for security - cloudflared will route traffic internally
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=example
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kraoq-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  mongo-data:
