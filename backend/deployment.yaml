apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraoq-backend
  namespace: kraoq
  labels:
    app: kraoq-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kraoq-backend
  template:
    metadata:
      labels:
        app: kraoq-backend
    spec:
      containers:
      - name: kraoq-backend
        image: your-registry/kraoq-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        # Mount API Key secret
        volumeMounts:
        - name: secrets-volume
          mountPath: /app/kraoq_secrets.json
          subPath: kraoq_secrets.json
          readOnly: true
      volumes:
      - name: secrets-volume
        secret:
          secretName: kraoq-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: kraoq-backend-service
  namespace: kraoq
spec:
  selector:
    app: kraoq-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP
