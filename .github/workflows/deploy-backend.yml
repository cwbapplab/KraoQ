name: Deploy Backend

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Deployment YAML
        run: |
          NEW_TAG=${{ steps.meta.outputs.tags }}
          # Update the deployment manifest with new tag
          # Note: Adjust path if needed. This looks for 'your-registry/kraoq-backend:.*' and replaces it.
          # Since existing deployment.yaml has placeholder 'your-registry/kraoq-backend:latest', we replace that line.
          
          # Using sed to find the image line for kraoq-backend container
          sed -i "s|image: .*kraoq-backend:.*|image: $NEW_TAG|g" backend/deployment.yaml
          
          cat backend/deployment.yaml # Verify content
          
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add backend/deployment.yaml
          git commit -m "Update backend image to $NEW_TAG"
          git push
